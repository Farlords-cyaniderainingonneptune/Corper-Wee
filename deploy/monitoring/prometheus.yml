global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'corperwee-api'
    metrics_path: '/api/v1/metrics'
    authorization:
      type: Bearer
      credentials: '${METRICS_BEARER_TOKEN}'
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'corper-wee-backend'
          environment: 'production'
