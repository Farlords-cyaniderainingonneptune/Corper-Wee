# ============================================================================
# CORPER WEE — PRODUCTION DEPLOYMENT STACK
# Services: PostgreSQL 16 + Redis 7 + API/WebSocket + Admin Portal + Backups + Prometheus
# Usage: docker compose -f deploy/docker-compose.production.yml --env-file .env up -d
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corperwee_prod}
      POSTGRES_USER: ${POSTGRES_USER:-corperwee_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../server/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corperwee_app} -d ${POSTGRES_DB:-corperwee_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      RELEASE_VERSION: ${RELEASE_VERSION:-1.0.0}
      APP_URL: ${APP_URL:-https://corperwee.ng}
      ADMIN_PORTAL_ORIGIN: ${ADMIN_PORTAL_ORIGIN:-https://admin.corperwee.ng}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://corperwee.ng,https://admin.corperwee.ng,capacitor://localhost}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-corperwee_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-corperwee_prod}?sslmode=disable
      REDIS_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health/ready >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - internal

  admin-portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"
    volumes:
      - ../admin-portal/dist:/usr/share/nginx/html:ro
      - ./nginx/admin-portal.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal

  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-corperwee_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-corperwee_prod}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - pg_backups:/backups
      - ../scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo '0 2 * * * /scripts/db-backup.sh >> /var/log/backup.log 2>&1' | crontab - && crond -f -l 2"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal

volumes:
  pg_data:
  redis_data:
  pg_backups:
  prom_data:

networks:
  internal:
    driver: bridge
