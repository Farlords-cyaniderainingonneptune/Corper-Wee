name: Corper Wee Production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    name: TypeCheck, Security & 14-Step Gameplay Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install root & admin portal dependencies
        run: |
          npm ci
          cd admin-portal && npm ci
      - name: TypeScript lint (Game + Server + Admin Portal)
        run: |
          npm run lint
          cd admin-portal && npm run lint
      - name: Run 180-check Functional, Security & Gameplay Test Suite
        run: npx tsx server/test/run.ts
      - name: Build Production Web & Admin Portal Bundles
        run: |
          npm run build
          cd admin-portal && npm run build

  verify-postgres-migrations:
    name: Verify PostgreSQL 16 Migrations
    runs-on: ubuntu-latest
    needs: verify-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: corperwee_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run 001 & 002 migrations cleanly
        env:
          DATABASE_URL: postgresql://postgres:ci_password@127.0.0.1:5432/corperwee_ci
        run: |
          chmod +x scripts/db-migrate.sh
          ./scripts/db-migrate.sh
          # Re-run to verify strict idempotency
          ./scripts/db-migrate.sh

  docker-build:
    name: Build Production Container Image
    runs-on: ubuntu-latest
    needs: verify-postgres-migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: corperwee/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android-release:
    name: Build Signed Android App Bundle (.aab)
    runs-on: ubuntu-latest
    needs: verify-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ANDROID_RELEASE == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build & sign Android App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x deploy/android/build-release.sh
          ./deploy/android/build-release.sh
      - name: Upload Play Store .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: corperwee-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
